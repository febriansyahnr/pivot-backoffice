ENVIRONMENT: "local"
SERVICE_NAME: "pivot-backoffice"
SERVICE_VERSION: "1.0.0"
GRACEFUL_WAIT_TIME: 300

# Order by alphabetically
AI_CONFIG:
  PROVIDER: 'anthropic'
  LLMS:
    - NAME: "anthropic"
      BASE_URL: "https://api.anthropic.com"
      DEFAULT:
        MODEL: "claude-sonnet-4-6"
        MAX_TOKEN: 4096
        TEMPERATURE: 0.1
      CLICKUP_COMMAND_PARSING:
        MODEL: "claude-haiku-4-5"
        MAX_TOKEN: 1024
        TEMPERATURE: 0
      SLACK_CONVERSATION:
        MODEL: "claude-sonnet-4-6"
        MAX_TOKEN: 4096
        TEMPERATURE: 0.1
      DEPLOYMENT_DESCRIPTION_GENERATION:
        MODEL: "claude-haiku-4-5"
        MAX_TOKEN: 2048
        TEMPERATURE: 0
      GITHUB_ANALYSIS:
        MODEL: "claude-sonnet-4-6"
        MAX_TOKEN: 4096
        TEMPERATURE: 0.1
      SQL_GENERATION:
        MODEL: "claude-sonnet-4-6"
        MAX_TOKEN: 4096
        TEMPERATURE: 0
      LOG_ANALYSIS:
        MODEL: "claude-sonnet-4-6"
        MAX_TOKEN: 4096
        TEMPERATURE: 0

APP:
  PAGINATION_PER_PAGE: 10
  BULK_DISBURSEMENT_EXPIRE_LOCK_MINUTE: 1440
  DISBURSEMENT_PROCESS_EXPIRE_LOCK_SECOND: 60
  PDK_LOGGER_USED: SLOGGER
  MASKING_SENSITIVE_DATA: password,token,accessToken,otp,otpCode,refreshToken,X-EXTERNAL-ID,X-Internal-Service-Key,X-API-Key,X-Request-PIN,X-Access-Token,Authorization,secret-header,X-CLIENT-SECRET,Internal-Api-Key,qrContent,encryptionKey
  USE_OVER_FETCH_PAGINATION: true
  INITIAL_PAGE_WINDOW: 5

CREDIT_CARD:
  WEBVIEW_URL: "http://localhost:4200"
  PROCESSOR_URL: "http://localhost:3002"

CREDITCARD_CORE_PROCESSOR:
  BASE_URL: "https://creditcard-stg.harsya.co"

DATABASE:
  DIALECT: "mysql"
  HOST: "10.20.0.3"
  PORT: "3306"
  MAX_IDLE_CONNS: 10
  MAX_OPEN_CONNS: 50
  MAX_IDLE_TIME: 300
  MAX_LIFE_TIME: 3600

DICTIONARY:
  PATH: "docs/dictionary-i18n.json"

FEATURE_FLAG:
  POLLING_INTERVAL: 10
  FILE_FORMAT: "YAML"
  START_WITH_RETRIEVER_ERROR: true
  OFFLINE: false
  CONSUL_ADDR: "localhost:8500"
  CONSUL_CONFIG_PATH: "backend-portal/feature-flag"
  CONSUL_PAYMENT_IMAGES: "backend-portal/payment-images"
  CONSUL_PAYMENT_INSTRUCTIONS: "backend-portal/payment-instructions"
  CONSUL_APP_VERSION: "backend-portal/app-version"
  SLACK_WEBHOOK_URL: ""
  EXPORTER_SLACK_WEBHOOK_URL: ""

HOST:
  STAGING: "https://api-stg.harsya.com/backend-portal"
  PRODUCTION: "https://api-stg.harsya.com/backend-portal"

MERCHANT_PORTAL:
  DASHBOARD_GUIDE_URL: "https://pivot-payment.gitbook.io/pivot-docs"
  LOGIN_URL: "https://dashboard.pivot-payment.com/login"
  LOGO_URL: "https://storage.googleapis.com/pg-staging-static-files/icon/pivot-logo.png"
  PAYMENT_SIMULATION_PATTERN_URL: ""
  USER_INVITATION_URL: "https://dashboard.pivot-payment.com/login-invitation"

MONITORING:
  IS_ENABLED: false
  MAX_BYTES_PER_PAYLOAD: 500000
  MAX_MESSAGES_PER_PAYLOAD: 5
  WRITE_TIMEOUT: 15

MONGODB:
  HOST: "10.90.0.3"
  PORT: "27017"

OTLP:
  HOST: "otlp.nr-data.net:4317"
  INSECURE: false
  TLS_CLIENT_CONFIG:
    INSECURE_SKIP_VERIFY: true
  METRIC:
    INTERVAL: 30 # seconds
    EXPORT_TIMEOUT: 60 #seconds
PERMISSION:
  PATH: "docs/menu-and-permission-list.json"

RABBITMQ:
  HOST: "localhost"
  PORT: "5672"

REDIS:
  HOST: "localhost"
  PORT: "6379"
  CACHE_DB: 0

RETENTION_CONFIG:
  INBOUND: 180 # in days

SHORT_LINK_REDIRECTION:
  URL_FORMAT: "https://link-stg.pivot-payment.com/s/%s"
  INVALID_URL: "https://payment-stg.harsya.com/invalid-link"

SNAP_CORE:
  BASE_URL: "http://localhost:3002"

WALLET_BACKEND:
  HOST: "http://pg-wallet-service"
  INTERNAL_PREFIX_URL: "/internal/v1/"

WORKER_POOL:
  DISBURSEMENT: 100

XB_CORE_PROCESSOR:
  BASE_URL: "http://localhost:3003"

RATE_LIMIT:
  LIMIT: 10
  TIME_OPTION: SECOND

VAULT:
  ADDRESS: "http://localhost:8200"
  SECRETS:
    USER_ENCRYPTION_KEY:
      MOUNT_PATH: backend_portal
      SECRET_PATH: user
      KEY_NAME: encryption_key
    MERCHANT_CREDENTIALS:
      SECRET_PATH: backend-portal-encryption
      SECRET_KEY: merchant-credentials