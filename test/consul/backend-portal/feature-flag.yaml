backend-portal-processor-routing:
  variations:
    merchant-paper:
      - processorName: SNAP_CORE_PROCESSOR
        priority: 1
        isActive: true
      - processorName: FLIP_PG_PROCESSOR
        priority: 2
        isActive: true
    merchant-easyLink:
      - processorName: SNAP_CORE_PROCESSOR
        priority: 1
        isActive: true
        allowedDestinations: ["!022"]
      - processorName: FLIP_PG_PROCESSOR
        priority: 2
        isActive: true
        allowedDestinations: ["022"]
    processorList:
      - processorName: SNAP_CORE_PROCESSOR
        priority: 1
        isActive: true
      - processorName: FLIP_PG_PROCESSOR
        priority: 2
        isActive: true
  targeting:
    - name: Merchant Paper
      query: key eq "922e39ab-7565-49f6-b84f-fb56122821ae"
      variation: merchant-paper
    - name: Merchant Easy Link
      query: key eq "00000000-0000-0000-0000-000000000001"
      variation: merchant-easyLink
  defaultRule:
    variation: processorList
