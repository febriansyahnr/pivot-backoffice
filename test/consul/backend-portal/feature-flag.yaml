backend-portal-merchant-should-enforce-new-mandatory-fields:
  variations:
    'default':
      cutoffDate: "2025-01-15T00:00:00Z"
      merchantIds:
        - "merchant-in-array-id"
    'enforced':
      cutoffDate: "2020-01-01T00:00:00Z"
      merchantIds: []
  targeting:
    - name: Targeted merchants that must enforce
      query: merchant_id in ["targeted-merchant-id", "another-targeted-merchant"]
      variation: 'enforced'
  defaultRule:
    variation: 'default'
  metadata:
    description: >-
      Controls mandatory field enforcement for submerchant creation via Open API.
      Fields affected: Website, Address, PostCode, DistrictId, ParentIndustry, ChildIndustry, MCC, CountryOfEntity, DigitalStatus.
      Merchants created before cutoffDate or in merchantIds bypass list will have these fields as optional for backward compatibility.
