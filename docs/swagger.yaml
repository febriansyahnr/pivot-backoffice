info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: |-
    To support payment gateway needs, we prepare technical documents on the backend-portal.
    Where the backend-portal is intended to serve services to OpenAPI and MerchantPortal,
    apart from that this service is integrated with Orchestrator, Core Processor
    (SNAP Core Processor and Credit Card Processor)
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Backend Portal API
  version: "1.0"
paths:
  /api/v1/activities:
    get:
      consumes:
      - application/json
      description: List activities endpoint
      operationId: api-activity-list
      parameters:
      - description: pagination current page
        in: query
        name: page
        type: string
      - description: filter startCreatedAt
        in: query
        name: startCreatedAt
        type: string
      - description: filter endCreatedAt
        in: query
        name: endCreatedAt
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/activityModel.Activity'
                  type: array
                meta:
                  $ref: '#/definitions/commonModel.Meta'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - Bearer: []
      summary: List activities endpoint
      tags:
      - API - Activity
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Endpoint Forgot Password with email, this process will send an
        OTP to the user email as an auth step before resetting the password.
      operationId: api-user-forgot-password
      parameters:
      - description: JSON Body for Forgot Password
        in: body
        name: Request
        required: true
        schema:
          $ref: '#/definitions/user.UserForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/user.User2FAResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: Forgot Password endpoint with email
      tags:
      - API - User
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Login endpoint with email and password will send an OTP for 2FA
        verification if the provided credentials are valid.
      operationId: api-user-login-otp
      parameters:
      - description: JSON Body for Login
        in: body
        name: Request
        required: true
        schema:
          $ref: '#/definitions/user.UserLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/user.User2FAResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: Login endpoint with email and password (2FA).
      tags:
      - API - User
  /api/v1/auth/otp/send:
    post:
      consumes:
      - application/json
      description: This endpoint is used to send an OTP email according to the selected
        event.
      operationId: api-user-otp-send
      parameters:
      - description: JSON Body for Send
        in: body
        name: Request
        required: true
        schema:
          $ref: '#/definitions/otp.SendOTPReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/otp.User2FARes'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: Send endpoint for send an OTP email.
      tags:
      - API - User
  /api/v1/auth/otp/verify:
    post:
      consumes:
      - application/json
      description: Verify endpoint for validate OTP. This endpoint requires a one-time
        token generated from the OTP request process.
      operationId: api-user-otp-verify
      parameters:
      - description: JSON Body for Verify OTP
        in: body
        name: Request
        required: true
        schema:
          $ref: '#/definitions/otp.VerifyOTPReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
